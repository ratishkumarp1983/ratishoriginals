# Local development services for Ratish Originals.
# Start:  docker compose up -d
# Stop:   docker compose down   (add -v to also drop the data volume)
services:
  postgres:
    image: postgres:16-alpine
    container_name: ratishoriginals-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ratishoriginals
      POSTGRES_PASSWORD: ratishoriginals
      POSTGRES_DB: ratishoriginals
    # Host port 5544 avoids clashing with a native Postgres on 5432.
    ports:
      - "5544:5432"
    volumes:
      - ratishoriginals_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratishoriginals -d ratishoriginals"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ratishoriginals-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ratishoriginals_redisdata:/data

volumes:
  ratishoriginals_pgdata:
  ratishoriginals_redisdata:
